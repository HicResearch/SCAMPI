sources:
  friendly_name:
    type: filesystem
    directory: /my_images
    file_regex: .*
    include_archives: True
  other_friendly_name:
    type: pacs
    aet: LOCALMACHINE
    aec: ORTHANC
    aem: LOCALMACHINE
    ip: localhost
    port: 4242
    store_port: 11113
    keys:
      - "StudyInstanceUID=1.3.12.2.1107.5.4.3.123456789012345.19950922.121803.6"
destination:
  files:
    directory: ~/some/directory
    compress: true
  metadata:
    dbType: MSSQL
    connectionString: mssql+pyodbc://scampi:scampi@host.docker.internal,1433/SCAMPI?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    index: some_column
